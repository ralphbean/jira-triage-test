# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize

# There can be only one. For now.
# This will be replaced by https://github.com/fullsend-ai/fullsend/pull/6237
forge: jira

agents:
    - name: triage
      source: harness/triage.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - ralphbean/jira-triage-test
            - fullsend-ai/fullsend
inference:
    project: it-gcp-konflux-dev-fullsend
    wif_provider: projects/855403973659/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-ralphbean-jira-triage-test
