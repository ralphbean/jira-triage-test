# .fullsend/harness/triage.yaml
base: https://raw.githubusercontent.com/fullsend-ai/agents/1013-port-triage-to-overlays/harness/triage.yaml#sha256=a6ec66f32361c0d7977d0ddbc2c05f19bab9bc2f04318a2efe4b0b59e078cd3d

trigger: >
  event.source.system == "jira" && event.entity.kind == "work_item"

allowed_remote_resources: [https://raw.githubusercontent.com/fullsend-ai/agents/]

env:
  runner:
    # KONFLUX doesn't have special transitions - just "closed"
    JIRA_DUPLICATE_TRANSITION: Closed
    JIRA_NOT_PLANNED_TRANSITION: Closed
    JIRA_SPLIT_TRANSITION: Closed
