# .fullsend/harness/triage.yaml
base: https://raw.githubusercontent.com/fullsend-ai/agents/main/harness/triage.yaml#sha256=44b1cecd335aa0a857e3d11a9224d9a1fb8ca60d2ffbd3abe3b84c6c7653e1c9

trigger: >
  event.source.system == "jira" && event.entity.kind == "work_item"

env:
  runner:
    FULLSEND_FORGE: "jira"
    FULLSEND_TRACKER: "jira"
    JIRA_DUPLICATE_TRANSITION: "Duplicate"
    JIRA_NOT_PLANNED_TRANSITION: "Won't Do"
    JIRA_SPLIT_TRANSITION: "Done"
    JIRA_TOKEN: "${JIRA_TOKEN}"
    JIRA_USER_EMAIL: "${JIRA_USER_EMAIL}"
    JIRA_BASE_URL: "${JIRA_BASE_URL}"
  sandbox:
    FULLSEND_FORGE: "jira"
    FULLSEND_TRACKER: "jira"
    JIRA_TOKEN: "${JIRA_TOKEN}"
    JIRA_USER_EMAIL: "${JIRA_USER_EMAIL}"
    JIRA_BASE_URL: "${JIRA_BASE_URL}"
